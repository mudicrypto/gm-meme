# "Build test app": Actions tab > Build test app > Run workflow.
# Needs one repository secret, EXPO_TOKEN (an Expo access token), set in
# Settings > Secrets and variables > Actions. Builds run on Expo's servers; the finished app
# appears at expo.dev under the project's Builds, with an install link and QR code.
name: Build test app

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which phones
        type: choice
        options: [android, ios, all]
        default: android
      profile:
        description: preview = installable test app; production = for the app stores
        type: choice
        options: [preview, production]
        default: preview

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the Expo token is set
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add an EXPO_TOKEN secret: Settings > Secrets and variables > Actions."
            exit 1
          fi
      - name: Link the Expo project (creates it on the first run)
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@24.12.0 init --non-interactive --force
      - name: Start the build on Expo
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: >-
          npx --yes eas-cli@24.12.0 build
          --platform ${{ inputs.platform }}
          --profile ${{ inputs.profile }}
          --non-interactive --no-wait
