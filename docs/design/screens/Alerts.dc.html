<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sift — Alerts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0D12}
a{color:#A9B5FF}a:hover{color:#C9D1FF}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0D12; color: #F3F5F9; font-family: Manrope, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">

  <header style="padding: 56px 20px 0; display: flex; align-items: center; gap: 12px">
    <a href="Main.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 14px; border: 1px solid #262C3A; background: #151922; color: #F3F5F9; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <h1 style="margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.6px; flex: 1">Alerts</h1>
    <a href="#" aria-label="Alert settings" style="width: 44px; height: 44px; border-radius: 14px; border: 1px solid #262C3A; background: #151922; color: #F3F5F9; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    </a>
  </header>

  <div style="padding: 16px 20px 0; display: flex; gap: 6px">
    <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
      <button onClick="{{f.pick}}" style="{{f.style}}">{{f.label}}</button>
    </sc-for>
  </div>

  <a href="Recap.dc.html" style="margin: 16px 20px 0; padding: 16px; border-radius: 20px; background: rgba(139,156,255,0.12); border: 1px solid rgba(139,156,255,0.35); display: flex; align-items: center; gap: 12px; text-decoration: none; color: #F3F5F9">
    <div style="width: 44px; height: 44px; border-radius: 14px; background: {{accent}}; display: flex; align-items: center; justify-content: center; flex: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0B0D12" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="m7 14 4-4 3 3 5-6"/></svg>
    </div>
    <div style="flex: 1">
      <div style="font-size: 15px; font-weight: 800">Your weekly recap is ready</div>
      <div style="font-size: 12px; color: #C9CFDA; margin-top: 2px">Oct 18 – 24 · wins, losses and scams avoided</div>
    </div>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C9CFDA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
  </a>

  <h2 style="margin: 20px 20px 4px; font-size: 13px; font-weight: 800; color: #9BA4B5; letter-spacing: 0.6px; text-transform: uppercase">Today</h2>
  <div style="padding: 0 20px; display: flex; flex-direction: column">
    <sc-for list="{{items}}" as="n" hint-placeholder-count="5">
      <div style="display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid #1A1E28">
        <div style="{{n.iconBox}}">
          <sc-if value="{{n.isPrice}}" hint-placeholder-val="{{true}}">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 15 7-7 7 7"/></svg>
          </sc-if>
          <sc-if value="{{n.isFriend}}" hint-placeholder-val="{{false}}">
            <span style="font-size: 15px; font-weight: 800">{{n.initial}}</span>
          </sc-if>
          <sc-if value="{{n.isSafety}}" hint-placeholder-val="{{false}}">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          </sc-if>
        </div>
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 14px; font-weight: 700; line-height: 1.35">{{n.title}}</div>
          <div style="font-size: 13px; color: #9BA4B5; margin-top: 2px; line-height: 1.4">{{n.body}}</div>
        </div>
        <span style="font-size: 12px; color: #8A93A5; white-space: nowrap">{{n.when}}</span>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 30px; padding: 12px 14px; border-radius: 14px; background: #151922; border: 1px solid #1F2430; display: flex; align-items: center; gap: 10px">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9BA4B5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <span style="font-size: 13px; color: #C9CFDA; flex: 1">Quiet hours <b style="color: #F3F5F9">23:00 – 08:00</b></span>
    <a href="#" style="font-size: 13px; font-weight: 700; text-decoration: none">Edit</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#8B9CFF","options":["#8B9CFF","#34D399","#F5B544","#F3F5F9"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { filter: 'All' }; }
  renderVals() {
    const accent = this.props.accent ?? '#8B9CFF';
    const filters = ['All', 'Price', 'Friends', 'Safety'].map((label) => {
      const on = this.state.filter === label;
      return { label, pick: () => this.setState({ filter: label }), style: 'height: 36px; padding: 0 14px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; border: 1px solid ' + (on ? accent : '#262C3A') + '; background: ' + (on ? accent : '#151922') + '; color: ' + (on ? '#0B0D12' : '#C9CFDA') };
    });
    const tone = {
      price: ['rgba(139,156,255,0.14)', '#A9B5FF'],
      friend: ['#2E5E7A', '#F3F5F9'],
      warn: ['rgba(251,191,36,0.14)', '#FBBF24'],
      good: ['rgba(52,211,153,0.14)', '#34D399']
    };
    const raw = [
      { kind: 'price', title: 'Moon Cat passed $0.000050', body: 'Your alert hit. Now $0.000052, +8% in 10 min.', when: '2m' },
      { kind: 'good', title: 'Sift hid Zorp Coin', body: 'Liquidity was pulled 3 min after launch. You were never shown it.', when: '9m' },
      { kind: 'friend', initial: 'M', title: 'Max sold Be Like Poland', body: '0.8 SOL · took +41% profit', when: '18m' },
      { kind: 'warn', title: 'Be Like Poland is now Caution', body: 'The dev launched 3 more tokens. You hold 0.23 SOL of it.', when: '1h' },
      { kind: 'friend', initial: 'A', title: 'Anya bought Moon Cat', body: '1.2 SOL · rated Safe', when: '2h' }
    ];
    const items = raw.map((n) => {
      const [bg, fg] = tone[n.kind];
      return {
        ...n,
        isPrice: n.kind === 'price',
        isFriend: n.kind === 'friend',
        isSafety: n.kind === 'warn' || n.kind === 'good',
        iconBox: 'width: 40px; height: 40px; border-radius: ' + (n.kind === 'friend' ? '50%' : '12px') + '; background: ' + bg + '; color: ' + fg + '; display: flex; align-items: center; justify-content: center; flex: none'
      };
    });
    return { accent, filters, items };
  }
}
</script>
</body>
</html>
