<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sift — Discover</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0D12}
a{color:#A9B5FF}a:hover{color:#C9D1FF}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0D12; color: #F3F5F9; font-family: Manrope, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">

  <header style="padding: 56px 20px 12px; display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; align-items: center; gap: 10px">
      <div style="width: 32px; height: 32px; border-radius: 10px; background: {{accent}}; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B0D12" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M7 12h10M10 17h4"/></svg>
      </div>
      <span style="font-size: 22px; font-weight: 800; letter-spacing: -0.5px">Sift</span>
    </div>
    <div style="display: flex; gap: 8px">
      <button aria-label="Search" style="width: 44px; height: 44px; border-radius: 14px; border: 1px solid #262C3A; background: #151922; color: #F3F5F9; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </button>
      <a href="Alerts.dc.html" aria-label="Alerts" style="text-decoration: none;width: 44px; height: 44px; border-radius: 14px; border: 1px solid #262C3A; background: #151922; color: #F3F5F9; display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <span style="position: absolute; top: 10px; right: 11px; width: 8px; height: 8px; border-radius: 50%; background: {{accent}}"></span>
      </a>
    </div>
  </header>

  <div style="padding: 4px 20px 0">
    <h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.8px; line-height: 1.15">Discover</h1>
    <p style="margin: 4px 0 0; font-size: 14px; color: #9BA4B5">Every token checked for scams before you see it</p>
  </div>

  <div style="padding: 16px 20px 0; display: flex; gap: 8px">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
      <button onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
    </sc-for>
  </div>

  <div style="margin: 14px 20px 0; padding: 12px 14px; border-radius: 14px; background: #151922; border: 1px solid #262C3A; display: flex; align-items: center; gap: 10px">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
    <span style="font-size: 13px; color: #C9CFDA; flex: 1">Safety filter on · <b style="color: #F3F5F9">12 red tokens hidden</b></span>
    <a href="#" style="font-size: 13px; font-weight: 700; text-decoration: none">Show</a>
  </div>

  <div style="padding: 14px 20px 0; display: flex; flex-direction: column; gap: 10px; flex: 1; overflow: hidden">
    <sc-for list="{{tokens}}" as="tk" hint-placeholder-count="5">
      <a href="Token.dc.html" style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 18px; background: #151922; border: 1px solid #1F2430; text-decoration: none; color: #F3F5F9">
        <div style="display: flex; align-items: center; gap: 12px">
          <div style="{{tk.avatar}}">{{tk.initials}}</div>
          <div style="flex: 1; min-width: 0">
            <div style="display: flex; align-items: center; gap: 6px">
              <span style="font-size: 16px; font-weight: 700">{{tk.name}}</span>
              <span style="font-size: 12px; color: #9BA4B5">{{tk.symbol}}</span>
            </div>
            <div style="font-size: 12px; color: #9BA4B5; margin-top: 2px; font-family: 'JetBrains Mono', monospace">{{tk.meta}}</div>
          </div>
          <div style="text-align: right">
            <div style="font-size: 15px; font-weight: 600; font-family: 'JetBrains Mono', monospace">{{tk.price}}</div>
            <div style="{{tk.changeStyle}}">{{tk.change}}</div>
          </div>
        </div>
        <div style="display: flex; align-items: center; gap: 8px">
          <span style="{{tk.badge}}"><span style="{{tk.dot}}"></span>{{tk.risk}}</span>
          <span style="font-size: 12px; color: #9BA4B5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{tk.why}}</span>
        </div>
      </a>
    </sc-for>
  </div>

  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 12px 28px; background: #0E1117; border-top: 1px solid #1F2430; display: flex; justify-content: space-around">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; padding: 6px 0; text-decoration: none; color: {{accent}}; font-size: 11px; font-weight: 700">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg>Discover</a>
    <a href="Feed.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; padding: 6px 0; text-decoration: none; color: #9BA4B5; font-size: 11px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.2c2.9.4 5 2.8 5 5.8"/></svg>Friends</a>
    <a href="Watchlist.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; padding: 6px 0; text-decoration: none; color: #9BA4B5; font-size: 11px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/></svg>Watchlist</a>
    <a href="Portfolio.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; padding: 6px 0; text-decoration: none; color: #9BA4B5; font-size: 11px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M16 13h2M3 10h18M7 6V4h10v2"/></svg>Portfolio</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#8B9CFF","options":["#8B9CFF","#34D399","#F5B544","#F3F5F9"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { tab: 'new' }; }
  renderVals() {
    const accent = this.props.accent ?? '#8B9CFF';
    const tabDefs = [['new', 'New'], ['trending', 'Trending'], ['safest', 'Safest']];
    const tabs = tabDefs.map(([id, label]) => {
      const on = this.state.tab === id;
      return {
        label,
        pick: () => this.setState({ tab: id }),
        style: 'height: 40px; padding: 0 16px; border-radius: 12px; font-size: 14px; font-weight: 700; cursor: pointer; border: 1px solid ' + (on ? accent : '#262C3A') + '; background: ' + (on ? accent : '#151922') + '; color: ' + (on ? '#0B0D12' : '#C9CFDA')
      };
    });
    const R = {
      safe: { label: 'Safe', c: '#34D399', bg: 'rgba(52,211,153,0.12)' },
      caution: { label: 'Caution', c: '#FBBF24', bg: 'rgba(251,191,36,0.12)' },
      danger: { label: 'Risky', c: '#F87171', bg: 'rgba(248,113,113,0.12)' }
    };
    const raw = [
      { name: 'Moon Cat', symbol: 'MOON', initials: 'MC', hue: '#3B3F8F', meta: '4m old · MC $48.2K', price: '$0.000048', change: '+182%', up: true, risk: 'safe', why: 'Mint locked · liquidity burned · fair launch' },
      { name: 'Desk Plant', symbol: 'LEAF', initials: 'DP', hue: '#1F5E4A', meta: '11m old · MC $21.7K', price: '$0.000022', change: '+64%', up: true, risk: 'safe', why: 'Top 10 holders own 14% · dev clean' },
      { name: 'Be Like Poland', symbol: 'POLAND', initials: 'BP', hue: '#6B3A2E', meta: '26m old · MC $9.4K', price: '$0.0000094', change: '-12%', up: false, risk: 'caution', why: 'Dev launched 3 tokens this week' },
      { name: 'C’est la vie', symbol: 'VIE', initials: 'CV', hue: '#4A2E6B', meta: '38m old · MC $6.1K', price: '$0.0000061', change: '+9%', up: true, risk: 'caution', why: 'Top 10 holders own 41%' },
      { name: 'Milly', symbol: 'MILLY', initials: 'MI', hue: '#2E4F6B', meta: '52m old · MC $3.3K', price: '$0.0000033', change: '-31%', up: false, risk: 'safe', why: 'Freeze authority revoked · LP burned' }
    ];
    const tokens = raw.map((t) => {
      const r = R[t.risk];
      return {
        ...t,
        risk: r.label,
        avatar: 'width: 44px; height: 44px; border-radius: 14px; background: ' + t.hue + '; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; color: #F3F5F9; flex: none',
        changeStyle: 'font-size: 13px; font-weight: 700; margin-top: 2px; font-family: JetBrains Mono, monospace; color: ' + (t.up ? '#34D399' : '#F87171'),
        badge: 'display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 800; flex: none; background: ' + r.bg + '; color: ' + r.c,
        dot: 'width: 7px; height: 7px; border-radius: 50%; background: ' + r.c
      };
    });
    return { accent, tabs, tokens };
  }
}
</script>
</body>
</html>
