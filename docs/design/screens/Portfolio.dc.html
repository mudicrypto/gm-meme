<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sift — Portfolio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0D12}
a{color:#A9B5FF}a:hover{color:#C9D1FF}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0D12; color: #F3F5F9; font-family: Manrope, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">

  <header style="padding: 56px 20px 0; display: flex; align-items: center; justify-content: space-between">
    <h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.8px">Portfolio</h1>
    <span style="height: 28px; padding: 0 10px; border-radius: 999px; background: rgba(251,191,36,0.14); color: #FBBF24; font-size: 11px; font-weight: 800; display: flex; align-items: center; letter-spacing: 0.4px">DEVNET</span>
  </header>

  <section aria-label="Balance" style="margin: 18px 20px 0; padding: 20px; border-radius: 24px; background: #151922; border: 1px solid #1F2430">
    <div style="font-size: 13px; color: #9BA4B5">Total value</div>
    <div style="font-size: 38px; font-weight: 700; letter-spacing: -1.4px; margin-top: 4px; font-family: 'JetBrains Mono', monospace">6.94 SOL</div>
    <div style="display: flex; align-items: center; gap: 8px; margin-top: 6px">
      <span style="font-size: 14px; font-weight: 700; color: #34D399; font-family: 'JetBrains Mono', monospace">+1.12 SOL</span>
      <span style="font-size: 13px; color: #9BA4B5">today · +19.2%</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 18px">
      <button style="height: 64px; border-radius: 16px; border: none; background: {{accent}}; color: #0B0D12; font-size: 12px; font-weight: 800; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12l7 7 7-7"/></svg>Deposit</button>
      <button style="height: 64px; border-radius: 16px; border: 1px solid #262C3A; background: #1D2230; color: #F3F5F9; font-size: 12px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>Send</button>
      <button style="height: 64px; border-radius: 16px; border: 1px solid #262C3A; background: #1D2230; color: #F3F5F9; font-size: 12px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M9 14h6M9 17h4"/></svg>Tax report</button>
    </div>
  </section>

  <a href="Recap.dc.html" style="margin: 12px 20px 0; padding: 12px 14px; border-radius: 18px; background: rgba(52,211,153,0.08); border: 1px solid rgba(52,211,153,0.25); display: flex; align-items: center; gap: 12px; text-decoration: none; color: #F3F5F9">
    <div style="width: 40px; height: 40px; border-radius: 12px; background: rgba(52,211,153,0.16); display: flex; align-items: center; justify-content: center; flex: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#34D399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
    </div>
    <div style="flex: 1">
      <div style="font-size: 15px; font-weight: 800"><span style="color: #34D399; font-family: 'JetBrains Mono', monospace">7</span> scams avoided this month</div>
      <div style="font-size: 12px; color: #9BA4B5; margin-top: 2px">Tokens Sift flagged red that later fell 90%+</div>
    </div>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9BA4B5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
  </a>

  <div style="padding: 16px 20px 6px; display: flex; justify-content: space-between; align-items: baseline">
    <h2 style="margin: 0; font-size: 17px; font-weight: 800">Holdings</h2>
    <a href="#" style="font-size: 13px; font-weight: 700; text-decoration: none">See all 4</a>
  </div>

  <div style="padding: 0 20px; display: flex; flex-direction: column">
    <sc-for list="{{holdings}}" as="h" hint-placeholder-count="4">
      <a href="Token.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #1A1E28; text-decoration: none; color: #F3F5F9">
        <div style="{{h.avatar}}">{{h.initials}}</div>
        <div style="flex: 1; min-width: 0">
          <div style="display: flex; align-items: center; gap: 8px">
            <span style="font-size: 15px; font-weight: 700">{{h.name}}</span>
            <span style="{{h.dot}}" title="{{h.risk}}"></span>
          </div>
          <div style="font-size: 12px; color: #9BA4B5; margin-top: 2px; font-family: 'JetBrains Mono', monospace">{{h.amount}}</div>
        </div>
        <div style="text-align: right">
          <div style="font-size: 15px; font-weight: 600; font-family: 'JetBrains Mono', monospace">{{h.value}}</div>
          <div style="{{h.pnlStyle}}">{{h.pnl}}</div>
        </div>
      </a>
    </sc-for>
  </div>

  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 12px 28px; background: #0E1117; border-top: 1px solid #1F2430; display: flex; justify-content: space-around">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; padding: 6px 0; text-decoration: none; color: #9BA4B5; font-size: 11px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg>Discover</a>
    <a href="Feed.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; padding: 6px 0; text-decoration: none; color: #9BA4B5; font-size: 11px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.2c2.9.4 5 2.8 5 5.8"/></svg>Friends</a>
    <a href="Watchlist.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; padding: 6px 0; text-decoration: none; color: #9BA4B5; font-size: 11px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/></svg>Watchlist</a>
    <a href="Portfolio.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; padding: 6px 0; text-decoration: none; color: {{accent}}; font-size: 11px; font-weight: 700">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M16 13h2M3 10h18M7 6V4h10v2"/></svg>Portfolio</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#8B9CFF","options":["#8B9CFF","#34D399","#F5B544","#F3F5F9"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#8B9CFF';
    const C = { safe: '#34D399', caution: '#FBBF24', danger: '#F87171' };
    const raw = [
      { name: 'SOL', initials: 'SO', hue: '#2A2350', amount: '4.82 SOL', value: '4.82 SOL', pnl: 'Cash', up: null, risk: 'safe' },
      { name: 'Moon Cat', initials: 'MC', hue: '#3B3F8F', amount: '10.4M MOON', value: '1.41 SOL', pnl: '+182%', up: true, risk: 'safe' },
      { name: 'Desk Plant', initials: 'DP', hue: '#1F5E4A', amount: '3.1M LEAF', value: '0.48 SOL', pnl: '+64%', up: true, risk: 'safe' }
    ];
    const holdings = raw.map((h) => ({
      ...h,
      risk: h.risk === 'safe' ? 'Safe' : 'Caution',
      avatar: 'width: 42px; height: 42px; border-radius: 14px; background: ' + h.hue + '; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; color: #F3F5F9; flex: none',
      dot: 'width: 8px; height: 8px; border-radius: 50%; background: ' + C[h.risk],
      pnlStyle: 'font-size: 13px; font-weight: 700; margin-top: 2px; font-family: JetBrains Mono, monospace; color: ' + (h.up === null ? '#9BA4B5' : h.up ? '#34D399' : '#F87171')
    }));
    return { accent, holdings };
  }
}
</script>
</body>
</html>
