# Render Blueprint for the Sift API (https://render.com/docs/blueprint-spec).
# In Render: New > Blueprint, pick this repo. Render asks for the values marked
# `sync: false`; paste them there, never into code. Everything else is set here.
services:
  - type: web
    name: sift-api
    runtime: node
    # Free sleeps after 15 idle minutes (the first request then takes ~1 minute, and price
    # alerts pause). Starter keeps it always on.
    plan: free
    region: frankfurt # next to the Supabase database
    # Only the API and the shared package: the mobile app isn't needed on the server.
    buildCommand: corepack enable && pnpm install --frozen-lockfile --filter "@sift/api..." && pnpm --filter @sift/api build
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: info
      # Devnet until the pre-mainnet checklist in docs/SECURITY_REVIEW.md is done.
      - key: SOLANA_CLUSTER
        value: devnet
      - key: ALLOW_MAINNET_TRADING
        value: 'false'
      # Render's proxy adds the caller's IP; trust exactly that one hop for rate limits.
      - key: TRUST_PROXY_HOPS
        value: '1'
      # Sift on the web (sift-site) calls the API from the browser.
      - key: CORS_ORIGINS
        value: https://sift-site.onrender.com
      # Generated once by Render; the API registers its Helius webhook with it at startup.
      - key: HELIUS_WEBHOOK_SECRET
        generateValue: true
      - key: HELIUS_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Public pages (/privacy, /terms, /support) for the store listings.
      - key: SUPPORT_EMAIL
        sync: false
      - key: OPERATOR_NAME
        sync: false

  # Sift on the web: the Expo web build of the app at /, the landing page at /about.
  # Wallets on the web are browser extensions (Phantom, Solflare…): keys stay there.
  - type: web
    name: sift-site
    runtime: static
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile --filter "@sift/mobile..." &&
      cd apps/mobile && npx expo export --platform web --output-dir dist &&
      mkdir -p dist/about && cp -r ../site/. dist/about/
    staticPublishPath: apps/mobile/dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: EXPO_PUBLIC_API_URL
        value: https://sift-api-ggmv.onrender.com
    routes:
      - type: rewrite
        source: /about
        destination: /about/index.html
      # Every app screen (/token/…, /trade/…) is the single-page app.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' https: data: blob:; connect-src 'self' https://sift-api-ggmv.onrender.com https://*.solana.com https://*.helius-rpc.com; frame-ancestors 'none'; base-uri 'self'; form-action 'none'"
      - path: /_expo/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
